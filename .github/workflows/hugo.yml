name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; never cancel one halfway through the reception.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - uses: actions/checkout@v4

      # Cheap guard: a deploy with the placeholders still in place produces a QR
      # code that points nowhere, and you'd only find out at the venue.
      - name: Check the config was filled in
        run: |
          for placeholder in CHANGE-ME WORKER_SUBDOMAIN; do
            if grep -q "$placeholder" hugo.toml; then
              echo "::error file=hugo.toml::hugo.toml still contains '$placeholder' — set apiBase and eventKey before deploying"
              exit 1
            fi
          done

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
