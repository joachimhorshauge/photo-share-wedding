{{- /*
  Renders a build-time QR code pointing at the upload page, passcode included.
  Usage: {{ partial "qr.html" (dict "scale" 8 "class" "qr") }}
*/ -}}
{{- $qr := partial "qr-src.html" (dict "scale" (.scale | default 6)) -}}
<img class="{{ .class | default "qr" }}"
     src="{{ $qr.RelPermalink }}"
     width="{{ $qr.Width }}" height="{{ $qr.Height }}"
     alt="QR code linking to the photo upload page">
